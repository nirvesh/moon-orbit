<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moon Orbit</title>
    <meta name="description" content="An animated space scene in pure HTML and CSS — a spinning Jupiter with four moons drifting across a starfield." />

    <!-- Open Graph (Facebook, LinkedIn, iMessage, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Moon Orbit" />
    <meta property="og:description" content="An animated space scene in pure HTML and CSS — a spinning Jupiter with four moons drifting across a starfield." />
    <meta property="og:url" content="https://nirvesh.github.io/moon-orbit/" />
    <meta property="og:image" content="https://raw.githubusercontent.com/nirvesh/moon-orbit/main/jupiter.png" />
    <meta property="og:image:alt" content="Jupiter with its banded clouds and moons against a starfield" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Moon Orbit" />
    <meta name="twitter:description" content="An animated space scene in pure HTML and CSS — a spinning Jupiter with four moons drifting across a starfield." />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/nirvesh/moon-orbit/main/jupiter.png" />

    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="shooting-star"></div>
    <div class="shooting-star shooting-star--2"></div>

    <div class="space">
      <div class="earth"></div>

      <div class="orbit">
        <div class="moon"></div>
      </div>

      <div class="orbit orbit--2">
        <div class="moon moon--2"></div>
      </div>

      <div class="orbit orbit--3">
        <div class="moon moon--3"></div>
      </div>

      <div class="orbit orbit--4">
        <div class="moon moon--4"></div>
      </div>
    </div>
  </body>
</html>
